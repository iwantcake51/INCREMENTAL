<!doctype html>
<html lang="en" data-palette="lumen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04141a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Lanterndeep: pilot a little submarine into the glowing dark, grab plankton, dodge what lives down there, and upgrade your way deeper." />
    <title>Lanterndeep</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <div class="app" id="app">
      <header class="topbar">
        <button class="brand" id="brand" type="button" aria-label="Lanterndeep">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 2c8 2 12 7 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="16" cy="23" r="6" class="brand-bulb" />
          </svg>
          <span class="brand-name">Lanterndeep</span>
        </button>
        <div class="depth-tag" id="depth-tag" hidden>Record <b id="depth-num">0 m</b></div>
        <div class="topbar-res">
          <span class="save-note" id="save-note" aria-live="polite"></span>
          <div class="chip chip-shards" id="chip-shards" hidden data-tip="Black Pearls you can spend on the Reef">
            <span class="chip-ic" data-icon="oyster-pearl"></span>
            <span class="chip-val" id="shards-top">0</span>
            <span class="chip-label">black pearls</span>
            <span class="chip-pending" id="shards-pending" hidden></span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-mute" type="button" aria-label="Mute sound" data-tip="Sound (M)"><span data-icon="speaker"></span></button>
          <button class="icon-btn" id="btn-help" type="button" aria-label="How to play" data-tip="How to play"><span data-icon="open-book"></span></button>
          <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings" data-tip="Settings"><span data-icon="settings-knobs"></span></button>
        </div>
      </header>

      <main class="layout">
        <section class="stage dock" id="stage" aria-label="The dock">
          <div class="counter">
            <div class="counter-value" id="lumen" aria-live="off">0</div>
            <div class="counter-label">lumen</div>
            <div class="counter-rate" id="farm-rate" hidden></div>
          </div>

          <button class="dock-sub" id="dock-sub" type="button" aria-label="Your submarine">
            <svg viewBox="-120 -80 240 150" aria-hidden="true">
              <defs>
                <radialGradient id="g-beam" cx="0" cy="0.5" r="1">
                  <stop offset="0" stop-color="#fff2c4" stop-opacity=".55" />
                  <stop offset="1" stop-color="#fff2c4" stop-opacity="0" />
                </radialGradient>
              </defs>
              <path class="dock-beam" d="M 58 -2 L 120 -40 L 120 36 L 58 4 Z" fill="url(#g-beam)" />
              <ellipse class="dock-hull" cx="0" cy="0" rx="62" ry="32" />
              <rect class="dock-hull" x="-20" y="-52" width="40" height="28" rx="8" />
              <rect class="dock-mast" x="-3" y="-70" width="6" height="20" rx="2" />
              <circle class="dock-port" cx="16" cy="-2" r="13" />
              <circle class="dock-port-glint" cx="12" cy="-6" r="4" />
              <g class="dock-rivets"><circle cx="-38" cy="16" r="2.5" /><circle cx="-18" cy="20" r="2.5" /><circle cx="36" cy="16" r="2.5" /></g>
              <rect class="dock-prop" x="-76" y="-16" width="8" height="32" rx="3" />
              <circle class="dock-lamp" cx="60" cy="0" r="6" />
            </svg>
          </button>

          <button class="btn btn-lg dive-btn" id="dive-btn" type="button"><span data-icon="submarine"></span> Dive <kbd>Space</kbd></button>
          <p class="dock-hint">Steer with the mouse, a finger or WASD. Grab glowing plankton and air, dodge anything that stings, and surface before you run out.</p>
          <div class="dock-cards" id="dock-cards"></div>
          <div class="dock-specs" id="dock-specs"></div>
        </section>

        <section class="panel" aria-label="Control desk">
          <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>
          <div class="tab-views" id="views"></div>
        </section>
      </main>

      <footer class="ticker" id="ticker" aria-label="Radio">
        <span class="ticker-tag">Radio</span>
        <div class="ticker-track"><span class="ticker-text" id="ticker-text"></span></div>
      </footer>
    </div>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
